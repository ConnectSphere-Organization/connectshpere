name: Microservices & Portals CI/CD (GitOps)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - 'services/**'
      - 'apps/**'

permissions:
  contents: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - api-gateway
          - auth-service
          - automation-service
          - billing-service
          - campaign-service
          - chat-service
          - contact-service
          - service-provider
          - webhook-ingestor
          - websocket-gateway
          - customer-portal
          - admin-portal
          - career-portal

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Azure Container Registry
        uses: azure/docker-login@v1
        with:
          login-server: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build Docker Image
        run: |
          IMAGE_TAG="${{ github.sha }}"
          SERVICE_PATH=""
          if [[ "${{ matrix.service }}" == *"-portal" ]]; then
            SERVICE_PATH="apps/${{ matrix.service }}"
          else
            SERVICE_PATH="services/${{ matrix.service }}"
          fi

          if [ -d "$SERVICE_PATH" ]; then
            docker build -f "$SERVICE_PATH/Dockerfile" -t ${{ secrets.ACR_LOGIN_SERVER }}/${{ matrix.service }}:${IMAGE_TAG} .
            
            # Trivy Vulnerability Scan
            curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
            trivy image --severity HIGH,CRITICAL ${{ secrets.ACR_LOGIN_SERVER }}/${{ matrix.service }}:${IMAGE_TAG}
            
            docker push ${{ secrets.ACR_LOGIN_SERVER }}/${{ matrix.service }}:${IMAGE_TAG}
            docker tag ${{ secrets.ACR_LOGIN_SERVER }}/${{ matrix.service }}:${IMAGE_TAG} ${{ secrets.ACR_LOGIN_SERVER }}/${{ matrix.service }}:latest
            docker push ${{ secrets.ACR_LOGIN_SERVER }}/${{ matrix.service }}:latest
          fi

      - name: Update Helm Image Tag for GitOps (ArgoCD)
        run: |
          mkdir -p infra/helm/environments/production
          OVERRIDE_FILE="infra/helm/environments/production/${{ matrix.service }}-values.yaml"
          
          echo "image:" > $OVERRIDE_FILE
          echo "  repository: ${{ secrets.ACR_LOGIN_SERVER }}/${{ matrix.service }}" >> $OVERRIDE_FILE
          echo "  tag: '${{ github.sha }}'" >> $OVERRIDE_FILE
          echo "azureKeyVault:" >> $OVERRIDE_FILE
          echo "  secretName: 'mongodb-uri-${{ matrix.service }}'" >> $OVERRIDE_FILE

      - name: Commit and Push Helm Tag Changes (GitOps trigger)
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chroma(gitops): update image tag for ${{ matrix.service }} to ${{ github.sha }}"
          branch: main
