name: Deprecated VM Deployment

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  deprecated:
    name: VM-based deployment has been retired
    runs-on: ubuntu-latest
    steps:
      - name: Warn about the retired deployment path
        run: |
          echo "The VM-based deployment workflow is no longer active."
          echo "ConnectSphere now uses GitHub Actions -> ACR -> GitOps repo -> Argo CD -> AKS with Helm."
          echo "Use .github/workflows/deploy-aks-gitops.yml for production deployments."
