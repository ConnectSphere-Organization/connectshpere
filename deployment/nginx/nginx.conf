user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;

    # Gzip compression
    gzip on;
    gzip_disable "msie6";
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Rate limiting zone for safety
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

    upstream api_gateway {
        server api-gateway:5001;
    }

    upstream websocket_gateway {
        server websocket-gateway:3009;
    }

    upstream webhook_ingestor {
        server webhook-ingestor:3013;
    }

    server {
        listen 80;
        listen [::]:80;
        server_name _;

        # Healthcheck endpoint for Nginx itself
        location /healthz {
            access_log off;
            add_header Content-Type text/plain;
            return 200 'OK';
        }

        # External Webhook Ingestion endpoint (Meta / Gupshup / Razorpay)
        location /api/webhooks {
            proxy_pass http://webhook_ingestor;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # WebSocket Gateway connection for Vercel apps & clients
        location /socket.io {
            proxy_pass http://websocket_gateway;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400;
        }

        # Central API Gateway route for Vercel Frontend Applications & Clients
        location / {
            limit_req zone=api_limit burst=30 nodelay;
            proxy_pass http://api_gateway;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
