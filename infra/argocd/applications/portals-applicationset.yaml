apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: connectsphere-portals
  namespace: argocd
spec:
  generators:
    - list:
        elements:
          - service: customer-portal
            ingressClass: nginx-customer
            ingressHost: connectsphere-customer-vivek.eastus2.cloudapp.azure.com
            containerPort: '3000'
          - service: admin-portal
            ingressClass: nginx
            ingressHost: connectsphere-admin-vivek.eastus2.cloudapp.azure.com
            containerPort: '3100'
  template:
    metadata:
      name: '{{service}}'
    spec:
      project: default
      source:
        repoURL: 'https://github.com/Vivekkumarprince1/connectshpere.git'
        targetRevision: HEAD
        path: infra/helm
        helm:
          valueFiles:
            - values.yaml
            # Each portal gets an immutable image tag written by CI after the
            # image has been built and pushed.  Missing files are intentional
            # during the initial migration from the mutable `latest` tag.
            - environments/production/{{service}}-values.yaml
          ignoreMissingValueFiles: true
          parameters:
            - name: azureKeyVault.secretName
              value: mongodb-uri-{{service}}
            - name: image.repository
              value: acrsaasprod.azurecr.io/{{service}}
            - name: ingress.enabled
              value: 'true'
            - name: ingress.className
              value: '{{ingressClass}}'
            - name: ingress.host
              value: '{{ingressHost}}'
            # Engine.IO keeps a polling session in the selected Socket.IO
            # process. Keep each browser on one upstream pod for the full
            # handshake/upgrade lifecycle.
            - name: ingress.annotations.nginx\.ingress\.kubernetes\.io/affinity
              value: cookie
            - name: ingress.annotations.nginx\.ingress\.kubernetes\.io/session-cookie-name
              value: connectsphere_socket_route
            - name: ingress.annotations.nginx\.ingress\.kubernetes\.io/session-cookie-path
              value: /socket.io
            - name: service.targetPort
              value: '{{containerPort}}'
            - name: "ingress.extraPaths[0].path"
              value: "/socket.io"
            - name: "ingress.extraPaths[0].pathType"
              value: "Prefix"
            - name: "ingress.extraPaths[0].backend.service.name"
              # Do not send Engine.IO through the horizontally-scaled API
              # gateway. Route it directly to Socket.IO so the ingress
              # affinity cookie selects the actual session owner.
              value: "websocket-gateway-enterprise-service"
            - name: "ingress.extraPaths[0].backend.service.port.name"
              value: "http"
            - name: "ingress.extraPaths[1].path"
              value: "/api"
            - name: "ingress.extraPaths[1].pathType"
              value: "Prefix"
            - name: "ingress.extraPaths[1].backend.service.name"
              value: "api-gateway"
            - name: "ingress.extraPaths[1].backend.service.port.name"
              value: "http"
      destination:
        server: https://kubernetes.default.svc
        namespace: production
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
