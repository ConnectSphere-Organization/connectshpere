apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: saas-microservices
  namespace: argocd
spec:
  generators:
    - list:
        elements:
          - service: api-gateway
            containerPort: "5001"
            livenessPath: "/health"
            readinessPath: "/ready"
            ingressEnabled: "true"
            ingressClass: "nginx-customer"
            ingressHost: "connectsphere-customer-vivek.eastus2.cloudapp.azure.com"
          - service: auth-service
            containerPort: "3006"
            livenessPath: "/health"
            readinessPath: "/ready"
            ingressEnabled: "false"
            ingressClass: "nginx"
            ingressHost: ""
          - service: automation-service
            containerPort: "3001"
            livenessPath: "/health"
            readinessPath: "/ready"
            ingressEnabled: "false"
            ingressClass: "nginx"
            ingressHost: ""
          - service: billing-service
            containerPort: "3003"
            livenessPath: "/health"
            readinessPath: "/ready"
            ingressEnabled: "false"
            ingressClass: "nginx"
            ingressHost: ""
          - service: campaign-service
            containerPort: "3002"
            livenessPath: "/health"
            readinessPath: "/ready"
            ingressEnabled: "false"
            ingressClass: "nginx"
            ingressHost: ""
          - service: chat-service
            containerPort: "3008"
            livenessPath: "/health"
            readinessPath: "/ready"
            ingressEnabled: "false"
            ingressClass: "nginx"
            ingressHost: ""
          - service: contact-service
            containerPort: "3007"
            livenessPath: "/health"
            readinessPath: "/ready"
            ingressEnabled: "false"
            ingressClass: "nginx"
            ingressHost: ""
          - service: service-provider
            containerPort: "3004"
            livenessPath: "/health"
            readinessPath: "/ready"
            ingressEnabled: "false"
            ingressClass: "nginx"
            ingressHost: ""
          - service: webhook-ingestor
            containerPort: "3013"
            livenessPath: "/health"
            readinessPath: "/ready"
            ingressEnabled: "false"
            ingressClass: "nginx"
            ingressHost: ""
          - service: websocket-gateway
            containerPort: "3009"
            livenessPath: "/health"
            readinessPath: "/ready"
            ingressEnabled: "false"
            ingressClass: "nginx"
            ingressHost: ""

  template:
    metadata:
      name: '{{service}}'
    spec:
      project: default
      source:
        repoURL: 'https://github.com/Vivekkumarprince1/connectshpere.git'
        targetRevision: HEAD
        path: infra/helm
        helm:
          valueFiles:
            - values.yaml
          parameters:
            - name: "azureKeyVault.secretName"
              value: "mongodb-uri-{{service}}"
            - name: "image.repository"
              value: "acrsaasprod.azurecr.io/{{service}}"
            - name: "service.targetPort"
              value: "{{containerPort}}"
            - name: "ingress.enabled"
              value: "{{ingressEnabled}}"
            - name: "ingress.className"
              value: "{{ingressClass}}"
            - name: "ingress.host"
              value: "{{ingressHost}}"
      destination:
        server: 'https://kubernetes.default.svc'
        namespace: production
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
