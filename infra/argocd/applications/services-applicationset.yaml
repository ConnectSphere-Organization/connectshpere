apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: saas-microservices
  namespace: argocd
spec:
  generators:
    - list:
        elements:
          - service: api-gateway
            containerPort: "5001"
            livenessPath: "/health"
            readinessPath: "/ready"
            ingressEnabled: "true"
            ingressClass: "nginx-customer"
            ingressHost: "connectsphere-customer-vivek.eastus2.cloudapp.azure.com"
          # customer-portal is managed by this ApplicationSet in the live
          # cluster. Keep it here so its generated Application retains the
          # Socket.IO ingress parameters below.
          - service: customer-portal
            containerPort: "3000"
            livenessPath: "/health"
            readinessPath: "/ready"
            ingressEnabled: "true"
            ingressClass: "nginx-customer"
            ingressHost: "connectsphere-customer-vivek.eastus2.cloudapp.azure.com"
          - service: auth-service
            containerPort: "3006"
            livenessPath: "/health"
            readinessPath: "/ready"
            ingressEnabled: "false"
            ingressClass: "nginx"
            ingressHost: ""
          - service: automation-service
            containerPort: "3001"
            livenessPath: "/health"
            readinessPath: "/ready"
            ingressEnabled: "false"
            ingressClass: "nginx"
            ingressHost: ""
          - service: billing-service
            containerPort: "3003"
            livenessPath: "/health"
            readinessPath: "/ready"
            ingressEnabled: "false"
            ingressClass: "nginx"
            ingressHost: ""
          - service: campaign-service
            containerPort: "3002"
            livenessPath: "/health"
            readinessPath: "/ready"
            ingressEnabled: "false"
            ingressClass: "nginx"
            ingressHost: ""
          - service: chat-service
            containerPort: "3008"
            livenessPath: "/health"
            readinessPath: "/ready"
            ingressEnabled: "false"
            ingressClass: "nginx"
            ingressHost: ""
          - service: contact-service
            containerPort: "3007"
            livenessPath: "/health"
            readinessPath: "/ready"
            ingressEnabled: "false"
            ingressClass: "nginx"
            ingressHost: ""
          - service: service-provider
            containerPort: "3004"
            livenessPath: "/health"
            readinessPath: "/ready"
            ingressEnabled: "false"
            ingressClass: "nginx"
            ingressHost: ""
          - service: webhook-ingestor
            containerPort: "3013"
            livenessPath: "/health"
            readinessPath: "/ready"
            ingressEnabled: "false"
            ingressClass: "nginx"
            ingressHost: ""
          - service: websocket-gateway
            containerPort: "3009"
            livenessPath: "/health"
            readinessPath: "/ready"
            ingressEnabled: "false"
            ingressClass: "nginx"
            ingressHost: ""

  template:
    metadata:
      name: '{{service}}'
    spec:
      project: default
      source:
        repoURL: 'https://github.com/Vivekkumarprince1/connectshpere.git'
        targetRevision: HEAD
        path: infra/helm
        helm:
          valueFiles:
            - values.yaml
            # CI records the image digest tag for each service here.  This
            # creates a Deployment manifest change for every release, which
            # lets Argo CD trigger Kubernetes' normal rolling update.
            - environments/production/{{service}}-values.yaml
          ignoreMissingValueFiles: true
          parameters:
            - name: "azureKeyVault.secretName"
              value: "mongodb-uri-{{service}}"
            - name: "image.repository"
              value: "acrsaasprod.azurecr.io/{{service}}"
            - name: "service.targetPort"
              value: "{{containerPort}}"
            - name: "ingress.enabled"
              value: "{{ingressEnabled}}"
            - name: "ingress.className"
              value: "{{ingressClass}}"
            - name: "ingress.host"
              value: "{{ingressHost}}"
            # Socket.IO Engine.IO sessions are local to a gateway process.
            # Direct traffic to that service and keep polling requests on its
            # initial pod; these values are harmless for ingress-disabled apps.
            - name: "ingress.annotations.nginx\\.ingress\\.kubernetes\\.io/affinity"
              value: "cookie"
            - name: "ingress.annotations.nginx\\.ingress\\.kubernetes\\.io/session-cookie-name"
              value: "connectsphere_socket_route"
            - name: "ingress.annotations.nginx\\.ingress\\.kubernetes\\.io/session-cookie-path"
              value: "/socket.io"
            - name: "ingress.extraPaths[0].path"
              value: "/socket.io"
            - name: "ingress.extraPaths[0].pathType"
              value: "Prefix"
            - name: "ingress.extraPaths[0].backend.service.name"
              value: "websocket-gateway-enterprise-service"
            - name: "ingress.extraPaths[0].backend.service.port.name"
              value: "http"
      destination:
        server: 'https://kubernetes.default.svc'
        namespace: production
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
