apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-saas-apps
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'https://github.com/Vivekkumarprince1/connectshpere.git'
    targetRevision: HEAD
    path: infra/argocd/applications
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
