apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "enterprise.fullname" . }}
  labels:
    {{- include "enterprise.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "enterprise.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "enterprise.selectorLabels" . | nindent 8 }}
        azure.workload.identity/use: "true"
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "enterprise.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          env:
            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- if eq .Release.Name "admin-portal" }}
            # Monitoring runs inside the admin-portal pod. localhost there is
            # the portal itself, not the rest of the platform.
            - name: GATEWAY_URL
              value: http://api-gateway-enterprise-service.production.svc.cluster.local:8080
            - name: AUTH_SERVICE_URL
              value: http://auth-service-enterprise-service.production.svc.cluster.local:8080
            - name: CHAT_SERVICE_URL
              value: http://chat-service-enterprise-service.production.svc.cluster.local:8080
            - name: CONTACT_SERVICE_URL
              value: http://contact-service-enterprise-service.production.svc.cluster.local:8080
            - name: BILLING_SERVICE_URL
              value: http://billing-service-enterprise-service.production.svc.cluster.local:8080
            - name: CAMPAIGN_SERVICE_URL
              value: http://campaign-service-enterprise-service.production.svc.cluster.local:8080
            - name: AUTOMATION_SERVICE_URL
              value: http://automation-service-enterprise-service.production.svc.cluster.local:8080
            - name: SERVICE_PROVIDER_URL
              value: http://service-provider-enterprise-service.production.svc.cluster.local:8080
            - name: WEBHOOK_INGESTOR_URL
              value: http://webhook-ingestor-enterprise-service.production.svc.cluster.local:8080
            - name: WEBSOCKET_URL
              value: http://websocket-gateway-enterprise-service.production.svc.cluster.local:8080
            - name: CUSTOMER_PORTAL_URL
              value: http://customer-portal-enterprise-service.production.svc.cluster.local:8080
            {{- end }}
            {{- if eq .Release.Name "api-gateway" }}
            # Service-to-service traffic must use Kubernetes DNS, never the
            # development localhost defaults compiled into the gateway.
            - name: AUTH_SERVICE_URL
              value: http://auth-service-enterprise-service.production.svc.cluster.local:8080
            - name: CONTACT_SERVICE_URL
              value: http://contact-service-enterprise-service.production.svc.cluster.local:8080
            - name: CHAT_SERVICE_URL
              value: http://chat-service-enterprise-service.production.svc.cluster.local:8080
            - name: SERVICE_PROVIDER_URL
              value: http://service-provider-enterprise-service.production.svc.cluster.local:8080
            - name: AUTOMATION_SERVICE_URL
              value: http://automation-service-enterprise-service.production.svc.cluster.local:8080
            - name: BILLING_SERVICE_URL
              value: http://billing-service-enterprise-service.production.svc.cluster.local:8080
            - name: CAMPAIGN_SERVICE_URL
              value: http://campaign-service-enterprise-service.production.svc.cluster.local:8080
            - name: WEBSOCKET_URL
              value: http://websocket-gateway-enterprise-service.production.svc.cluster.local:8080
            - name: WEBHOOK_INGESTOR_URL
              value: http://webhook-ingestor-enterprise-service.production.svc.cluster.local:8080
            {{- end }}
            {{- if eq .Release.Name "chat-service" }}
            # Chat dispatches outbound messages and resolves contacts itself.
            # In Kubernetes these must never fall back to localhost defaults.
            - name: CONTACT_SERVICE_URL
              value: http://contact-service-enterprise-service.production.svc.cluster.local:8080
            - name: BSP_SERVICE_URL
              value: http://service-provider-enterprise-service.production.svc.cluster.local:8080
            - name: SERVICE_PROVIDER_URL
              value: http://service-provider-enterprise-service.production.svc.cluster.local:8080
            - name: BILLING_SERVICE_URL
              value: http://billing-service-enterprise-service.production.svc.cluster.local:8080
            - name: AUTOMATION_SERVICE_URL
              value: http://automation-service-enterprise-service.production.svc.cluster.local:8080
            {{- end }}
            {{- if eq .Release.Name "automation-service" }}
            # Automation executes rule actions through the owning services.
            # localhost here points back to automation itself, not chat/BSP.
            - name: CHAT_SERVICE_URL
              value: http://chat-service-enterprise-service.production.svc.cluster.local:8080
            - name: CONTACT_SERVICE_URL
              value: http://contact-service-enterprise-service.production.svc.cluster.local:8080
            - name: BSP_SERVICE_URL
              value: http://service-provider-enterprise-service.production.svc.cluster.local:8080
            - name: SERVICE_PROVIDER_URL
              value: http://service-provider-enterprise-service.production.svc.cluster.local:8080
            - name: API_GATEWAY_URL
              value: http://api-gateway-enterprise-service.production.svc.cluster.local:8080
            {{- end }}
            {{- if eq .Release.Name "campaign-service" }}
            # Campaign lifecycle/preflight invokes these services directly.
            # The development defaults point to this pod's localhost and turn
            # a valid start request into a downstream 500 in production.
            - name: CHAT_SERVICE_URL
              value: http://chat-service-enterprise-service.production.svc.cluster.local:8080
            - name: BSP_SERVICE_URL
              value: http://service-provider-enterprise-service.production.svc.cluster.local:8080
            - name: CONTACT_SERVICE_URL
              value: http://contact-service-enterprise-service.production.svc.cluster.local:8080
            - name: BILLING_SERVICE_URL
              value: http://billing-service-enterprise-service.production.svc.cluster.local:8080
            - name: AUTOMATION_SERVICE_URL
              value: http://automation-service-enterprise-service.production.svc.cluster.local:8080
            - name: API_GATEWAY_URL
              value: http://api-gateway-enterprise-service.production.svc.cluster.local:8080
            {{- end }}
            {{- if eq .Release.Name "customer-portal" }}
            # Next.js evaluates rewrites in the portal container.
            - name: BACKEND_API_URL
              value: http://api-gateway-enterprise-service.production.svc.cluster.local:8080
            {{- end }}
            {{- if or (eq .Release.Name "admin-portal") (eq .Release.Name "service-provider") }}
            # Public, TLS-verified callback used for Gupshup V3 webhook
            # subscriptions. It enters through API Gateway and the ingestor.
            - name: WHATSAPP_WEBHOOK_URL
              value: https://connectsphere-customer-vivek.eastus2.cloudapp.azure.com/api/webhooks/whatsapp
            {{- end }}
            {{- if .Values.azureKeyVault.enabled }}
            - name: MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: {{ include "enterprise.fullname" . }}-mongodb-secret
                  key: MONGODB_URI
            # Auth service uses MONGO_URI while the other services use MONGODB_URI.
            # Supply both aliases from the single Key Vault-backed value.
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: {{ include "enterprise.fullname" . }}-mongodb-secret
                  key: MONGODB_URI
            {{- end }}
          {{- if .Values.runtimeSecretName }}
          envFrom:
            - secretRef:
                name: {{ .Values.runtimeSecretName }}
            {{- if or (eq .Release.Name "service-provider") (eq .Release.Name "admin-portal") }}
            # Gupshup partner credentials are synchronized from Azure Key Vault
            # by this release's SecretProviderClass. The admin portal uses
            # them only for server-side subscription management.
            - secretRef:
                name: {{ include "enterprise.fullname" . }}-gupshup-secret
            {{- end }}
            {{- if eq .Release.Name "admin-portal" }}
            # The admin portal reads provider app/subscription state from the
            # BSP-owned database.
            - secretRef:
                name: {{ include "enterprise.fullname" . }}-bsp-mongodb-secret
            {{- end }}
          {{- end }}
          # Backends do not expose a uniform HTTP health endpoint. A TCP probe
          # verifies the actual listening port without causing restart loops.
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.readinessProbe.periodSeconds }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if .Values.azureKeyVault.enabled }}
          volumeMounts:
            - name: secrets-store-inline
              mountPath: "/mnt/secrets-store"
              readOnly: true
          {{- end }}
      {{- if .Values.azureKeyVault.enabled }}
      volumes:
        - name: secrets-store-inline
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: {{ include "enterprise.fullname" . }}-spc
      {{- end }}
