{{- if .Values.ingress.enabled -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "enterprise.fullname" . }}
  labels:
    {{- include "enterprise.labels" . | nindent 4 }}
  annotations:
    {{- toYaml .Values.ingress.annotations | nindent 4 }}
    {{- if eq .Release.Name "customer-portal" }}
    # The public customer hostname is served by the dedicated customer
    # controller, so HTTP-01 challenges must use the same ingress class.
    acme.cert-manager.io/http01-ingress-class: nginx-customer
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.host }}
  # Every public portal hostname requires its own certificate. The customer
  # portal shares its hostname with the API gateway; Admin has a distinct
  # hostname and therefore must not rely on the customer's TLS secret.
  tls:
    - hosts:
        - {{ .Values.ingress.host | quote }}
      secretName: {{ include "enterprise.fullname" . }}-tls
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          {{- if and (eq .Release.Name "customer-portal") .Values.ingress.extraPaths }}
          {{- toYaml .Values.ingress.extraPaths | nindent 10 }}
          {{- end }}
          # Customer traffic remains on the portal while API traffic is
          # explicitly routed to the gateway. This also keeps the Socket.IO
          # route owned by a single ingress, avoiding NGINX duplicate-path
          # admission failures.
          - path: {{ if eq .Release.Name "api-gateway" }}/api{{ else }}/{{ end }}
            pathType: Prefix
            backend:
              service:
                name: {{ include "enterprise.fullname" . }}
                port:
                  name: http
{{- end }}
