{{- if .Values.azureKeyVault.enabled -}}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ include "enterprise.fullname" . }}-spc
  labels:
    {{- include "enterprise.labels" . | nindent 4 }}
spec:
  provider: azure
  secretObjects:
    - secretName: {{ include "enterprise.fullname" . }}-mongodb-secret
      type: Opaque
      data:
        - key: MONGODB_URI
          objectName: {{ .Values.azureKeyVault.secretName }}
    {{- if or (eq .Release.Name "service-provider") (eq .Release.Name "admin-portal") }}
    # The provider's WhatsApp send path authenticates with the Gupshup Partner
    # API. These secrets already live in the production Key Vault; make them
    # available to the service without copying secret values into Git.
    - secretName: {{ include "enterprise.fullname" . }}-gupshup-secret
      type: Opaque
      data:
        - key: GUPSHUP_PARTNER_EMAIL
          objectName: gupshup-partner-email
        - key: GUPSHUP_PARTNER_PASSWORD
          objectName: gupshup-partner-password
        - key: GUPSHUP_PARTNER_CLIENT_SECRET
          objectName: gupshup-partner-client-secret
    {{- end }}
    {{- if eq .Release.Name "admin-portal" }}
    # The Super Admin console reads every service-owned database directly.
    # Keep the URIs server-side in a Kubernetes Secret; never expose them to
    # the browser through NEXT_PUBLIC_* configuration.
    - secretName: {{ include "enterprise.fullname" . }}-platform-mongodb-secret
      type: Opaque
      data:
        - key: MONGODB_URI_BILLING
          objectName: mongodb-uri-billing-service
        - key: MONGODB_URI_CAMPAIGN
          objectName: mongodb-uri-campaign-service
        - key: MONGODB_URI_AUTOMATION
          objectName: mongodb-uri-automation-service
        - key: MONGODB_URI_BSP
          objectName: mongodb-uri-service-provider
    {{- end }}
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "true"
    userAssignedIdentityID: {{ .Values.azureKeyVault.userAssignedIdentityID | quote }}
    keyvaultName: {{ .Values.azureKeyVault.keyVaultName | quote }}
    cloudName: ""
    objects:  |
      array:
        - |
          objectName: {{ .Values.azureKeyVault.secretName | quote }}
          objectType: secret
          objectVersion: ""
        {{- if or (eq .Release.Name "service-provider") (eq .Release.Name "admin-portal") }}
        - |
          objectName: "gupshup-partner-email"
          objectType: secret
          objectVersion: ""
        - |
          objectName: "gupshup-partner-password"
          objectType: secret
          objectVersion: ""
        - |
          objectName: "gupshup-partner-client-secret"
          objectType: secret
          objectVersion: ""
        {{- end }}
        {{- if eq .Release.Name "admin-portal" }}
        - |
          objectName: "mongodb-uri-billing-service"
          objectType: secret
          objectVersion: ""
        - |
          objectName: "mongodb-uri-campaign-service"
          objectType: secret
          objectVersion: ""
        - |
          objectName: "mongodb-uri-automation-service"
          objectType: secret
          objectVersion: ""
        - |
          objectName: "mongodb-uri-service-provider"
          objectType: secret
          objectVersion: ""
        {{- end }}
    tenantId: {{ .Values.azureKeyVault.tenantId | quote }}
{{- end }}
